# PostgreSQL local pour le développement (pas pour la production).
#   docker compose up -d
# Identifiants de dev uniquement, alignés sur les valeurs par défaut de Backend/src/main/resources/application.yaml.
services:
  postgres:
    image: postgres:17-alpine
    container_name: autostrike-postgres
    environment:
      POSTGRES_DB: autostrike
      POSTGRES_USER: autostrike
      POSTGRES_PASSWORD: autostrike
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
